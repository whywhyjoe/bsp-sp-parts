<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sp-list-ordering · dev harness</title>
<!-- DEV HARNESS — simulates a SharePoint page hosting the sp-list-ordering
     custom script web part as a DROP-IN: the page owns its own chrome, the
     web part zone is a bounded container (not the whole screen), and the
     content injected into it mirrors sp-list-ordering.webpart.html (section
     ground override + optional heading + target div). The zone renders LATE
     (1.2 s, like SharePoint), exercising the timer+DOM-check boot; the mock
     data adapter activates because `pnp` is absent. vendor/ CSS + alpine are
     dev-only copies — live pages use /sites/FCUPortal/Code/… instead. -->
<link rel="stylesheet" href="vendor/colors_and_type.css">
<link rel="stylesheet" href="vendor/components.css">
<link rel="stylesheet" href="../sp-list-ordering/sp-list-ordering.css">
<style>
  /* Bare stand-in for a SharePoint modern page: white canvas, a fake title
     region, and a bounded section the web part lands in. Harness-only CSS. */
  body { margin: 0; background: #fff; font: var(--type-body1); color: var(--fg-primary); }
  .fake-sp-chrome { padding: 24px 32px; border-bottom: 1px solid var(--stroke-divider); color: var(--fg-secondary); }
  .fake-canvas { max-width: 1024px; margin: 0 auto; padding: 24px 32px 64px; }
  .fake-zone { border: 1px dashed var(--stroke-divider); padding: 16px; }
  .fake-zone-label { font: var(--type-caption2); color: var(--fg-secondary); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; }
  .harness-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .harness-bar__note { font: var(--type-caption1); color: var(--fg-secondary); }
</style>
</head>
<body>

<div class="fake-sp-chrome">SharePoint page chrome lives here (site header, nav, page title) — not the tool's concern.</div>

<div class="fake-canvas">
  <div class="harness-bar">
    <button class="btn btn--subtle btn--sm" type="button" id="btn-spa">Simulate SPA navigation</button>
    <button class="btn btn--subtle btn--sm" type="button" id="btn-edit">Toggle edit mode</button>
    <span class="harness-bar__note" id="harness-note"></span>
  </div>
  <p class="fake-zone-label">Custom script web part zone (bounded container — the tool must fill it, not the screen)</p>
  <div class="fake-zone" id="webpart-zone"><!-- stub content injected late, below --></div>
</div>

<script>
  // Simulate SharePoint rendering the web part zone late and out of order.
  // What lands here mirrors sp-list-ordering.webpart.html (the per-instance
  // stub): section-ground override, optional heading, target div.
  function renderWebPartStub() {
    document.getElementById('webpart-zone').innerHTML =
      '<style>' +
      '  .fake-zone:has([data-sp-part="list-ordering"]) { background: var(--surface-subtle); }' +
      '  [data-sp-part="list-ordering"] { background: var(--surface-subtle); }' +
      '</style>' +
      '<div class="section-head" style="margin-bottom:var(--space-160)">' +
      '  <h2 class="section-head__title">List ordering</h2>' +
      '  <p class="section-head__lede">Drag items into the order your pages should show them, then save. Ordering applies within the current filter; other scopes are untouched.</p>' +
      '</div>' +
      '<div data-sp-part="list-ordering" data-config="../sp-list-ordering/sp-list-ordering.config.json"></div>';
  }
  setTimeout(renderWebPartStub, 1200);

  document.getElementById('btn-spa').addEventListener('click', function () {
    document.getElementById('harness-note').textContent = 'Navigated — zone torn down, re-mount should follow.';
    window.__harnessNavigate();
  });
  document.getElementById('btn-edit').addEventListener('click', function () {
    document.body.classList.toggle('editmode');
    var on = document.body.classList.contains('editmode');
    document.getElementById('harness-note').textContent =
      on ? 'Edit mode ON — expect the placeholder, no grid.' : 'Edit mode OFF — live tool should return.';
    // dcs-part-boot re-checks on its own timers; nudge it for an instant result.
    var part = window.dcsParts && window.dcsParts['sp-list-ordering'];
    if (part) part.mountAll();
  });
</script>

<script>
  // Minimal stand-in for std-spa-loader.js so the harness exercises the real
  // SPA re-mount path. fcu-standard.js is NOT loaded here, so dcs-part-boot.js
  // supplies its own waitForElement / waitForPnP2 / dcsRegisterAlpineComponent.
  (function () {
    var subs = [];
    window.dcsOnSpaNavigation = function (id, cb) { subs.push({ id: id, cb: cb }); };
    window.__harnessNavigate = function () {
      history.pushState({}, '', location.pathname + '?nav=' + Date.now());
      var zone = document.getElementById('webpart-zone');
      zone.innerHTML = '';                       // SharePoint tears the zone down…
      setTimeout(function () {                   // …then re-renders it a beat later
        renderWebPartStub();
        subs.forEach(function (s) { s.cb({ id: s.id, reason: 'pushState' }); });
      }, 400);
    };
  })();
</script>
<script src="../_shared/dcs-part-boot.js"></script>
<script src="../sp-list-ordering/sp-list-ordering.js"></script>
<!-- Vendored Alpine (dev only) so the harness opens from disk with no network;
     production self-hosts alpine.js in /sites/FCUPortal/Code/lib/. -->
<script defer src="vendor/alpine.js"></script>

</body>
</html>
