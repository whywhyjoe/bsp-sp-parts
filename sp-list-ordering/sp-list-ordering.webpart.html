<!-- ═══════════════════════════════════════════════════════════════════════
     sp-list-ordering — custom script web part stub (bsp-sp-parts v0.1.0)

     PER-INSTANCE FILE. To put this tool on a page:
       1. Copy this file next to the page/app that embeds it.
       2. Write a config JSON for your lists (see sp-list-ordering.config.json
          for the schema) and point data-config below at it.
       3. Point the custom script web part at your copy of this file.

     The tool is a drop-in: it fills the web part's container and brings no
     page chrome of its own (the page/SharePoint owns that). The title and
     description below are plain per-instance markup — edit or delete freely.

     The shared assets (sp-list-ordering.js / .css) are deployed ONCE per site;
     only the data-config URL (and the copy below) should differ between
     copies of this stub.

     DEPLOY REPOINT — the URLs below assume:
       design system  →  /sites/FCUPortal/Code/bsp-design/
       libs           →  /sites/FCUPortal/Code/lib/
       this tool      →  /sites/FCUPortal/SiteAssets/sp-parts/sp-list-ordering/
     Adjust for your site. Two stubs on one page are fine: the loader mounts
     every [data-sp-part="list-ordering"] div independently, and the script/link
     tags are safe to repeat (same-URL CSS is a no-op; pnp/Alpine keep the first
     load).
     ═══════════════════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="/sites/FCUPortal/Code/bsp-design/styles.css">
<link rel="stylesheet" href="/sites/FCUPortal/SiteAssets/sp-parts/sp-list-ordering/sp-list-ordering.css">

<style>
  /* SECTION GROUND (per-instance override) — the tool's cards read best on
     --surface-subtle, and the page section that contains this web part has to
     supply it. Point the :has() selector at YOUR canvas/section container for
     the page this ships on (the usual "#CanvasZoneContainer:has(#MyWebPart)"
     maneuver); the fallback rule below it needs no :has support and simply
     paints the web part's own box. Delete whichever you don't want. */
  #CanvasZoneContainer:has([data-sp-part="list-ordering"]) { background: var(--surface-subtle); }
  [data-sp-part="list-ordering"] { background: var(--surface-subtle); }
</style>

<!-- OPTIONAL heading — per-instance copy; edit or delete. (No eyebrow, no page
     chrome: SharePoint's page furniture surrounds this web part already.) -->
<div class="section-head" style="margin-bottom:var(--space-160)">
  <h2 class="section-head__title">List ordering</h2>
  <p class="section-head__lede">Drag items into the order your pages should show them, then save. Ordering applies within the current filter; other scopes are untouched.</p>
</div>

<div data-sp-part="list-ordering"
     data-config="/sites/FCUPortal/SiteAssets/sp-parts/sp-list-ordering/sp-list-ordering.config.json"></div>

<!-- pnp2.bundle.js exposes the global `pnp2`. Drop this tag if the page already
     loads PnPjs via the standard include; a second load is harmless either way. -->
<script src="/sites/FCUPortal/Code/lib/pnp2.bundle.js"></script>

<!-- Shared boot helper (dcsMountPart). Must come BEFORE the tool script. It uses
     fcu-standard.js's waitForElement / waitForPnP2 / dcsOnSpaNavigation /
     dcsRegisterAlpineComponent when present, and defines stand-ins when they aren't,
     so the tool also runs on pages without the standard include. -->
<script src="/sites/FCUPortal/SiteAssets/sp-parts/_shared/dcs-part-boot.js"></script>

<script src="/sites/FCUPortal/SiteAssets/sp-parts/sp-list-ordering/sp-list-ordering.js"></script>
<script defer src="/sites/FCUPortal/Code/lib/alpine.js"></script>
