       1. Copy this file next to the page/app that embeds it.

          for the schema) and point data-config below at it.
       3. Point the custom script web part at your copy of this file.

     The shared assets (sp-list-ordering.js / .css) are deployed ONCE per site;
     only the data-config URL should differ between copies of this stub.

     DEPLOY REPOINT — the URLs below assume:
       design system  →  /sites/FCUPortal/Code/bsp-design/
       libs           →  /sites/FCUPortal/Code/lib/
       this tool      →  /sites/FCUPortal/SiteAssets/sp-parts/sp-list-ordering/
     Adjust for your site. Two stubs on one page are fine: the loader mounts
     every [data-sp-part="list-ordering"] div independently, and the script/link
     tags are safe to repeat (same-URL CSS is a no-op; pnp/Alpine keep the first
     load).
     ═══════════════════════════════════════════════════════════════════════ -->
